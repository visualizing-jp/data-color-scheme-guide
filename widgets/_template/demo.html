<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>図のひな形（確認用）</title>
  <link rel="stylesheet" href="../../css/base.css">
  <script src="../../vendor/d3/d3.min.js"></script>
</head>
<body>
  <main class="page">
    <!-- 図を 1 つだけ表示する確認用ページ。コピーした図では、import 先と data-widget の名前を差し替える。 -->
    <figure class="widget" id="app" data-widget="_template"></figure>
  </main>
  <script type="module">
    import { loadDeps } from '../../lib/deps.js';
    import { mount } from './index.js';

    const el = document.getElementById('app');
    try {
      mount(el, await loadDeps());
    } catch (error) {
      console.error(error);
      el.textContent = `表示できませんでした：${error.message}`;
    }
  </script>
</body>
</html>
