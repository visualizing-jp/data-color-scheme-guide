<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>導入図「同じデータなのに、見え方がちがう」（確認用）</title>
  <link rel="stylesheet" href="../../css/base.css">
  <script src="../../vendor/d3/d3.min.js"></script>
</head>
<body>
  <main class="page">
    <figure class="widget" id="app" data-widget="intro-compare"></figure>
  </main>
  <script type="module">
    import { loadDeps } from '../../lib/deps.js';
    import { mount } from './index.js';

    const el = document.getElementById('app');
    try {
      await mount(el, await loadDeps());
      document.documentElement.dataset.widgetsReady = 'true';
    } catch (error) {
      console.error(error);
      const box = document.createElement('div');
      box.className = 'widget-error';
      box.setAttribute('role', 'alert');
      box.textContent = `図を表示できませんでした：${error.message}`;
      el.replaceChildren(box);
    }
  </script>
</body>
</html>
